    <title>CANNA COOKIES</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('cc_lang')
          var nav = (navigator.language || 'cs').slice(0, 2).toLowerCase()
          var lang = stored === 'cs' || stored === 'en' || stored === 'ru' ? stored : nav === 'ru' || nav === 'en' || nav === 'cs' ? nav : 'cs'
          location.replace('/' + lang + '/')
        } catch (e) {
          location.replace('/cs/')
        }
      })()
    </script>
  </head>
